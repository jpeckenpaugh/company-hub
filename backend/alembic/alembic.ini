[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s
path_separator = os

# Placeholder only: env.py resolves the actual URL from backend.config (which
# honors COMPANY_HUB_DB) so migrations always target the app's database.
sqlalchemy.url = sqlite+aiosqlite:///data/company_hub.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S